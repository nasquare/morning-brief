name: Build morning brief

on:
  schedule:
    # 23:00 UTC = 07:00 Singapore time, every day
    - cron: "0 23 * * *"
  workflow_dispatch:   # lets you run it on demand from the Actions tab

permissions:
  contents: write       # allows the job to save the updated data.json back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install feedparser rapidfuzz

      - name: Build the brief
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python build_brief.py

      - name: Save the updated brief
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update brief $(date -u +%Y-%m-%d)"
          git push
